[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stop-retrieving"
version = "0.1.0"
description = "Learning when to stop (and when to give up) in iterative multi-hop retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Warda Masood" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "rank_bm25>=0.2.2", "ruff", "requests"]

[project.scripts]
stopret = "stopret.cli:main"

[tool.setuptools]
packages = ["stopret"]